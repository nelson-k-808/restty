# Commands for which `restty init` emits safe shell wrappers.
enabled_commands = ["ls", "ps", "df", "du", "git", "docker", "lsblk", "free", "ip"]
disabled_parsers = []

# Inputs beyond either limit are emitted byte-for-byte without parsing.
max_lines = 10000
max_bytes = 8388608
min_confidence = 0.72

# `colorblind` selects a blue/yellow/magenta palette; `none` disables colors.
theme = "default"
border_style = "rounded" # heavy, light, rounded, double, ascii, or none
terminal_profile = "auto" # auto, unicode, truecolor, ansi16, or ascii
watch_samples = 20 # in-memory samples retained per gauge while watching

[breakpoints]
compact = 60
core = 100
wide = 160

# Lower numbers survive at narrower widths. Column keys are documented in README.md.
[columns.ls]
name = 0
size = 1
modified = 1
mode = 2
owner = 2
group = 3
links = 3

# Numeric and percentage cells can override parser-assigned semantic styles.
[thresholds.df.use]
warning = 75
error = 90